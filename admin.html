<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dramafy Admin - Add Video Links</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#0a0b10] text-neutral-100 min-h-screen p-6">
<div class="max-w-2xl mx-auto space-y-5">
  <h1 class="text-2xl font-black">Add video link</h1>
  <p class="text-sm text-neutral-400">Pick a drama, paste a link you are allowed to use (MP4, HLS .m3u8, or YouTube), save. It appears on the site instantly.</p>
  <input id="q" placeholder="Search drama (e.g. Lovely Runner)" class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10">
  <select id="drama" size="6" class="w-full px-3 py-2 rounded-lg bg-[#121420] border border-white/10"></select>
  <select id="ep" class="w-full px-3 py-2 rounded-lg bg-[#121420] border border-white/10"></select>
  <input id="url" placeholder="https://.../video.mp4  or  .m3u8  or  youtube.com/watch?v=..." class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10">
  <label class="flex items-center gap-2 text-sm text-amber-300"><input type="checkbox" id="tamil" checked> This video has Tamil dub audio</label>
  <button id="save" class="px-5 py-2 rounded-lg bg-rose-600 hover:bg-rose-500 font-bold">Save link</button>
  <span id="msg" class="text-sm text-emerald-400 ml-2"></span>
  <h2 class="text-lg font-bold pt-4">Saved links</h2>
  <div id="list" class="space-y-2 text-sm"></div>
  <a href="/" class="text-rose-400 text-sm">&larr; Back to site</a>
</div>
<script src="js/data.js"></script>
<script>
const $ = id => document.getElementById(id);
function fill() {
  const q = $('q').value.toLowerCase();
  $('drama').innerHTML = INITIAL_DRAMAS.filter(d => d.title.toLowerCase().includes(q)).map(d => `<option value="${d.id}">${d.title}</option>`).join('');
  fillEps();
}
function fillEps() {
  const d = INITIAL_DRAMAS.find(x => x.id === $('drama').value);
  $('ep').innerHTML = '<option value="all">All episodes (one link)</option>' + (d ? d.episodes.map(e => `<option value="${e.epNum}">Episode ${e.epNum}: ${e.title}</option>`).join('') : '');
}
async function refresh() {
  const db = await (await fetch('/api/links')).json();
  $('list').innerHTML = Object.entries(db).flatMap(([id, m]) => Object.entries(m).filter(([ep]) => ep !== '_tamil').map(([ep, u]) =>
    `<div class="flex justify-between gap-3 bg-white/5 rounded-lg p-2"><span class="truncate">${id} / ${ep}: ${u}</span><button data-id="${id}" data-ep="${ep}" class="del text-rose-400">delete</button></div>`)).join('') || '<p class="text-neutral-500">None yet.</p>';
  document.querySelectorAll('.del').forEach(b => b.onclick = async () => {
    await fetch('/api/links', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dramaId: b.dataset.id, epNum: b.dataset.ep }) });
    refresh();
  });
}
$('q').oninput = fill; $('drama').onchange = fillEps;
$('save').onclick = async () => {
  const r = await fetch('/api/links', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dramaId: $('drama').value, epNum: $('ep').value, tamil: $('tamil').checked, url: $('url').value.trim() }) });
  $('msg').textContent = r.ok ? 'Saved!' : 'Invalid link';
  $('msg').className = 'text-sm ml-2 ' + (r.ok ? 'text-emerald-400' : 'text-red-400');
  refresh();
};
fill(); refresh();
</script></body></html>
